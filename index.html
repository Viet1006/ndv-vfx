<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>NDV VFX</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #121419; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; background: #121419; }
      #ndv-loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                    gap: 14px; font: 600 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #9aa1b2; background: #121419; }
      #ndv-loader h1 { margin: 0; font-size: 34px; letter-spacing: 2px; color: #ff8520; }
      #ndv-bar { width: min(360px, 70vw); height: 6px; border-radius: 3px; background: #23262f; overflow: hidden; }
      #ndv-fill { width: 0; height: 100%; background: #ff8520; transition: width .15s; }
      #ndv-error { color: #ff6b6b; max-width: 80vw; text-align: center; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="ndv-loader">
      <h1>NDV VFX</h1>
      <div id="ndv-bar"><div id="ndv-fill"></div></div>
      <div id="ndv-status">Loading...</div>
    </div>
    <script src="TemplateData/ndv-pack.js"></script>
    <script src="Build/68f65755e5c8acb2187dffcf623ec59b.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loader = document.querySelector("#ndv-loader");
      var fill = document.querySelector("#ndv-fill");
      var status = document.querySelector("#ndv-status");

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/fd8a83a607f29b7e42787adf588d366a.data.unityweb",
        frameworkUrl: "Build/87fdb097a34c527b101239ede821c72f.framework.js.unityweb",
        codeUrl: "Build/b7fab267fcbcaeb0f1daebdf34f2248b.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "NDV VFX",
        productVersion: "0.1",
      }, function (progress) {
        fill.style.width = Math.round(progress * 100) + "%";
        status.textContent = "Loading... " + Math.round(progress * 100) + "%";
      }).then(function (unityInstance) {
        loader.style.display = "none";
        canvas.focus();
      }).catch(function (message) {
        status.id = "ndv-error";
        status.textContent = message;
      });
    </script>
  </body>
</html>
